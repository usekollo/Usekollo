allowBuilds:
  # Prisma's postinstall downloads the schema/query engine binaries — without
  # it every prisma command fails on a missing engine.
  '@prisma/engines': true
  # Pulled in by the Stellar Wallets Kit's WalletConnect module. Its
  # postinstall is not needed for the SDK to work.
  '@reown/appkit': false
  # Optional native speedups for `ws`, reached through WalletConnect. Both
  # have pure-JS fallbacks, so skipping the native build costs nothing here.
  bufferutil: false
  # esbuild's postinstall fetches its platform binary, which `tsx` runs on.
  esbuild: true
  prisma: true
  # Native binding with a JS fallback; only the fallback is reachable from
  # the browser bundle anyway.
  secp256k1: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
